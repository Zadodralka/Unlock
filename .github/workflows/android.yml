name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Cache libXray.aar
        id: libxray-cache
        uses: actions/cache@v4
        with:
          path: android/app/libs/libXray.aar
          key: libxray-android-${{ hashFiles('android/scripts/build-libxray.sh') }}

      - name: Build libXray.aar
        if: steps.libxray-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./scripts/build-libxray.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Unlock-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      # Релиз на GitHub: приложение проверяет version.json из последнего релиза
      # и скачивает новый APK само (кнопка «Обновить»)
      - name: Prepare release files
        id: release
        run: |
          VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          VERSION_NAME="0.2.${GITHUB_RUN_NUMBER}"
          TAG="android-v${VERSION_NAME}"
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/Unlockless.apk
          jq -n \
            --argjson code "$VERSION_CODE" \
            --arg name "$VERSION_NAME" \
            --arg notes "$(git log -1 --format=%s)" \
            --arg apk "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/Unlockless.apk" \
            '{versionCode: $code, versionName: $name, notes: $notes, apk: $apk}' > dist/version.json
          cat dist/version.json
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$VERSION_NAME" >> "$GITHUB_OUTPUT"

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: Unlockless ${{ steps.release.outputs.name }} (Android)
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: |
            android/dist/Unlockless.apk
            android/dist/version.json
