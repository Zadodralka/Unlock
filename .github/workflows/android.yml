name: Android

on:
  push:
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Cache libXray.aar
        id: libxray-cache
        uses: actions/cache@v4
        with:
          path: android/app/libs/libXray.aar
          key: libxray-android-${{ hashFiles('android/scripts/build-libxray.sh') }}

      - name: Build libXray.aar
        if: steps.libxray-cache.outputs.cache-hit != 'true'
        run: |
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          ./scripts/build-libxray.sh

      - uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Unlock-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
