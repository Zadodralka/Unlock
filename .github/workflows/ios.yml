name: iOS

on:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: false

      - name: Cache LibXray.xcframework
        id: libxray-cache
        uses: actions/cache@v4
        with:
          path: ios/Frameworks/LibXray.xcframework
          key: libxray-${{ hashFiles('ios/scripts/build-libxray.sh') }}

      - name: Build LibXray.xcframework
        if: steps.libxray-cache.outputs.cache-hit != 'true'
        run: ./scripts/build-libxray.sh

      - name: Upload LibXray.xcframework
        uses: actions/upload-artifact@v4
        with:
          name: LibXray.xcframework
          path: ios/Frameworks/LibXray.xcframework

      - name: Generate Xcode project
        run: |
          brew install xcodegen
          xcodegen generate

      # Без подписи: проверяем, что приложение и туннель компилируются и линкуются
      - name: Build (unsigned)
        run: |
          xcodebuild -project Unlock.xcodeproj -scheme Unlock \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build | tail -n 200
          exit ${PIPESTATUS[0]}
