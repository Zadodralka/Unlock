# Проект Xcode генерируется командой `xcodegen generate` из этого файла.
# Bundle id и Team ID задаются в Config/Project.xcconfig / Config/Local.xcconfig.
name: Unlock

options:
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true

configFiles:
  Debug: Config/Project.xcconfig
  Release: Config/Project.xcconfig

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    # Go-рантайм внутри LibXray использует резолвер из libresolv
    OTHER_LDFLAGS: ["$(inherited)", "-lresolv"]

targets:
  Unlock:
    type: application
    platform: iOS
    scheme: {}
    sources:
      - path: App
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Unlock
        AppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        ITSAppUsesNonExemptEncryption: false
        # unlock://add/<ссылка подписки> — импорт по ссылке из бота или сайта
        CFBundleURLTypes:
          - CFBundleURLName: $(APP_BUNDLE_ID)
            CFBundleURLSchemes: [unlock]
    entitlements:
      path: App/Unlock.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - target: PacketTunnel
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd

  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - path: PacketTunnel
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).tunnel
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDisplayName: PacketTunnel
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.security.application-groups: [$(APP_GROUP_ID)]
    dependencies:
      - framework: Frameworks/LibXray.xcframework
        embed: false
      - sdk: NetworkExtension.framework
      - sdk: libresolv.tbd
